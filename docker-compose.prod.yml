version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: codesach_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    # Set DOCKER_USERNAME in your .env file on the server
    image: ${DOCKER_USERNAME}/codesach-backend:latest
    container_name: codesach_backend
    ports:
      - '5001:5000'
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    image: ${DOCKER_USERNAME}/codesach-frontend:latest
    container_name: codesach_frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
