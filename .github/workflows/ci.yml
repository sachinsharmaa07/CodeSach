name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm install

      - name: Install Backend Dependencies
        working-directory: ./apps/backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm install

      - name: Lint Backend
        working-directory: ./apps/backend
        run: npm run lint
        continue-on-error: true # Prevents pipeline from fully failing during migration phases

      - name: Lint Frontend
        working-directory: ./apps/frontend
        run: npm run lint
        continue-on-error: true

      - name: Build Frontend
        working-directory: ./apps/frontend
        run: npm run build

  build-and-push-docker:
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/codesach-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/codesach-frontend:latest

  deploy-to-ec2:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Create project directory if it doesn't exist
            mkdir -p ~/codesach
            cd ~/codesach

            # Write the docker-compose.prod.yml file directly to the server
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              caddy:
                image: caddy:latest
                container_name: codesach_caddy
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./Caddyfile:/etc/caddy/Caddyfile
                  - caddy_data:/data
                  - caddy_config:/config
                restart: unless-stopped
                depends_on:
                  - frontend

              mongodb:
                image: mongo:latest
                container_name: codesach_mongo
                ports:
                  - "27017:27017"
                volumes:
                  - mongodb_data:/data/db
                restart: unless-stopped

              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/codesach-backend:latest
                container_name: codesach_backend
                env_file:
                  - .env
                depends_on:
                  - mongodb
                restart: unless-stopped

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/codesach-frontend:latest
                container_name: codesach_frontend
                depends_on:
                  - backend
                restart: unless-stopped

            volumes:
              mongodb_data:
              caddy_data:
              caddy_config:
            EOF

            # Write the Caddyfile
            cat << 'EOF' > Caddyfile
            codesach.duckdns.org {
              reverse_proxy frontend:80
            }
            EOF

            # Pull latest images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f
