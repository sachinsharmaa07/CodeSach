apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: codesach-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: MONGODB_URI
              value: 'mongodb://mongodb:27017/codesach'
            - name: PORT
              value: '5000'
            - name: NODE_ENV
              value: 'production'
            # Add JWT_SECRET and GOOGLE credentials here as needed
